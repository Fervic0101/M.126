<div id="lista" >
    <li *ngFor="let elemento of this.Lista; index as i" style="list-style: none" appElementiStile>
       
            <h1>{{ elemento.name }}</h1>
            <h2>{{ elemento.description }}</h2>
            <div *ngIf="elemento.price ==  this.PrezzoPiccolo[i]">
                <h3 style="background-color: green;">{{ elemento.price }}€</h3>
            </div>
            <div *ngIf="elemento.price!=this.PrezzoPiccolo[i]">
                <h3>{{ elemento.price }}€</h3>
            </div>
            <div *ngIf="elemento.available">
                <h5 style="color: green;  font-size: 16px;">DISPONIBILE</h5>
            </div>
            <div *ngIf="!elemento.available">
                <h5 style="color: red; font-size: 16px;">NON DISPONIBILE</h5>
            </div>
            

        
    </li>
</div>
