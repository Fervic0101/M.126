<div class="home-container">
  <h1 appTitleElement>Spesa Intelligente</h1>

  <app-searchbar (filterChange)="applyFilterToAll($event)"></app-searchbar>

  <div class="prodotti-wrapper">
    <div class="supermarket-section">
      <label><h2>COOP</h2></label>
      <app-prodotti 
        [supermarket]="0" 
        [filters]="filters" 
        [highlightedProducts]="highlightedProducts"
        (loaded)="onProductsLoaded(0, $event)">
      </app-prodotti>
    </div>

    <div class="supermarket-section">
      <label><h2>Esselunga</h2></label>
      <app-prodotti 
        [supermarket]="1" 
        [filters]="filters" 
        [highlightedProducts]="highlightedProducts"
        (loaded)="onProductsLoaded(1, $event)">
      </app-prodotti>
    </div>

    <div class="supermarket-section">
      <label><h2>Carrefour</h2></label>
      <app-prodotti 
        [supermarket]="2" 
        [filters]="filters" 
        [highlightedProducts]="highlightedProducts"
        (loaded)="onProductsLoaded(2, $event)">
      </app-prodotti>
    </div>
  </div>
</div>
