<h1 appTitleElement>Spesa Intelligente</h1>

<input [(ngModel)]="query" placeholder="Cerca prodotti..." />

<label>
  <input type="checkbox" [(ngModel)]="onlyAvailable" />
  Solo disponibili
</label>

<label>
  Prezzo min
  <input
    type="number"
    [ngModel]="minPrice"
    (ngModelChange)="minPrice = $event === '' ? null : +$event"
    min="0"
    step="0.01"
  />
</label>
<!--(ngModelChange) non è l evento dom change (che dovresti fare $event.target.value e parsarlo da stringa a XX ), ma un output della direttiva ngModel che emette il valore già parsato nel type giusto (es. number). il trucco di +$event è l unary plus, che coercizza qualcosa a number (csostituibile con Number($event)); un in più avendo già usato (ngModelChange). Molto probabilmente bastava benissimo un comodissimo "<input type="number" [(ngModel)]="minPrice" min="0" step="0.01">" ma adesso non abbiamo il tempo di approfondire le magie di angular-->

<label>
  Prezzo max
  <input
    type="number"
    [ngModel]="maxPrice"
    (ngModelChange)="maxPrice = $event === '' ? null : +$event"
    min="0"
    step="0.01"
  />
</label>

<div appContainer>
  <section *ngFor="let e of entries; trackBy: trackByMarket">
    <h3>{{ e[0] | titlecase }}</h3>
    <app-prodotti [products]="filter(e[1])"></app-prodotti>
  </section>
</div>

<!-- titlecase si usa così : | titlecase ; e rende maiuscola la prima lettera della parola. Le serve CommonModule.Anche a ngFor serve common module.-->
<!--trackBy è direttiva magica di angular ma di fatto è come il key in React. ti basta usarla e definire nel ts una funzione con firma firma: (index, item) => id  in questo caso e[0] è il nome del supermercato, stabile e unico → perfetto come chiave.-->
