<h3>Gestione Prodotti - Area Admin</h3>
<div class="supermarket-container">
  <mat-card class="supermarket-card">
    <mat-card-title>Coop</mat-card-title>
    <mat-card-content>
      Gestisci i prodotti Coop
    </mat-card-content>
    <button mat-raised-button (click)="openSupermarket('coop')">
      Vai a Coop
    </button>
  </mat-card>

  <mat-card class="supermarket-card">
    <mat-card-title>Esselunga</mat-card-title>
    <mat-card-content>
      Gestisci i prodotti Esselunga
    </mat-card-content>
    <button mat-raised-button (click)="openSupermarket('esselunga')">
      Vai a Esselunga
    </button>
  </mat-card>

  <mat-card class="supermarket-card">
    <mat-card-title>Carrefour</mat-card-title>
    <mat-card-content>
      Gestisci i prodotti Carrefour
    </mat-card-content>
    <button mat-raised-button (click)="openSupermarket('carrefour')">
      Vai a Carrefour
    </button>
  </mat-card>
</div>
