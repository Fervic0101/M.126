<div class="supermercato-area">
  <h2>Gestione Supermercato</h2>
  <section class="aggiungi-prodotto">
    <h3>Inserisci nuovo prodotto</h3>
    <form>
      <label for="nome">Nome prodotto</label>
      <input type="text" id="nome" name="nome" required>
      <label for="prezzo">Prezzo originale</label>
      <input type="number" id="prezzo" name="prezzo" required>
      <label for="offerta">Prezzo offerta</label>
      <input type="number" id="offerta" name="offerta">
      <label for="descrizione">Descrizione</label>
      <textarea id="descrizione" name="descrizione"></textarea>
      <button type="submit">Aggiungi prodotto</button>
    </form>
  </section>
  <section class="prodotti-lista">
    <h3>Prodotti inseriti</h3>
    <table>
      <thead>
        <tr>
          <th>Nome</th>
          <th>Prezzo originale</th>
          <th>Prezzo offerta</th>
          <th>Descrizione</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let prodotto of prodotti">
          <td>{{prodotto.nome}}</td>
          <td>{{prodotto.prezzo}} €</td>
          <td>
            <span *ngIf="prodotto.offerta < prodotto.prezzo; else noOfferta">{{prodotto.offerta}} €</span>
            <ng-template #noOfferta>-</ng-template>
          </td>
          <td>{{prodotto.descrizione}}</td>
        </tr>
      </tbody>
    </table>
  </section>
</div>
