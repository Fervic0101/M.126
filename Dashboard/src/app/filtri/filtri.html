<div class="filters">
  <input
    type="text"
    [(ngModel)]="searchText"
    (input)="applyFilters()"
    placeholder="Cerca per nome"
  />

  <input
    type="number"
    [(ngModel)]="minPrice"
    (input)="applyFilters()"
    placeholder="Prezzo minimo"
  />
  <input
    type="number"
    [(ngModel)]="maxPrice"
    (input)="applyFilters()"
    placeholder="Prezzo massimo"
  />
</div>

<div class="tables-container">
  <table border="1" cellspacing="0" cellpadding="8">
    <thead>
      <tr>
        <th>Nome</th>
        <th>Prezzo</th>
        <th>Disponibile</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let product of filteredCoopProducts">
        <td>{{ product.name }}</td>
        <td [appMinPrezzo]="isMinPrice(product)">
          {{ product.price }}
        </td>
        <td>{{ isAviable(product) }}</td>
      </tr>
    </tbody>
  </table>

  <table border="1" cellspacing="0" cellpadding="8">
    <thead>
      <tr>
        <th>Nome</th>
        <th>Prezzo</th>
        <th>Disponibile</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let product of filteredEsselungaProducts">
        <td>{{ product.name }}</td>
        <td [appMinPrezzo]="isMinPrice(product)">
          {{ product.price }}
        </td>
        <td>{{ isAviable(product) }}</td>
      </tr>
    </tbody>
  </table>

  <table border="1" cellspacing="0" cellpadding="8">
    <thead>
      <tr>
        <th>Nome</th>
        <th>Prezzo</th>
        <th>Disponibile</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let product of filteredCarrefourProducts">
        <td>{{ product.name }}</td>
        <td [appMinPrezzo]="isMinPrice(product)">
          {{ product.price }}
        </td>
        <td>{{ isAviable(product) }}</td>
      </tr>
    </tbody>
  </table>
</div>
